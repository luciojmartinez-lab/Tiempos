<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiempos</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172026;
        background: #f6f8f7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      main {
        width: min(720px, 100%);
        padding: 40px;
        border: 1px solid #d8e0de;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 48px rgba(25, 44, 41, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1;
      }

      p {
        margin: 0;
        color: #54615f;
        font-size: 1.1rem;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tiempos</h1>
      <p>
        Proyecto inicial listo para Netlify. Aqui construiremos el control de
        tiempos de trabajo a partir del Excel actual.
      </p>
    </main>
  </body>
</html>
